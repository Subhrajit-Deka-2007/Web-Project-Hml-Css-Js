<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says Game</title>
    <link rel="stylesheet" href="SimonGame.css">
</head>
<body>
    <h1>Simon Game</h1>
    <h2>Press any key on "keyboard"to start the game .</h2>
    <div class="btn-container">
        <div class="line-one">
        <div class="btn red" type="button" id="red">1</div>
        <!-- 
        Okay now we had declared its type button so now it will work internally as button .
        -->
        <div class="btn yellow" type="button" id="yellow">2</div>
        </div>
        <div class="line-two">
        <div class="btn green" type="button" id ="green">3</div>
        <div class="btn blue" type="button" id ="blue">4</div>
        </div>
    </div>
    <script src="SimonGame.js"></script>
</body>
</html>
